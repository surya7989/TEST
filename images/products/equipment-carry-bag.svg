<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Soft Canvas -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)" />

  <!-- Carry Handle Straps (Behind) -->
  <path d="M190 190 V110 C190 90, 310 90, 310 110 V190" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" />
  <path d="M210 110 C210 102, 290 102, 290 110" fill="none" stroke="#0D9488" stroke-width="16" stroke-linecap="round" />

  <!-- Main Bag Body with Shadow -->
  <rect x="100" y="180" width="300" height="230" rx="28" fill="url(#bagGrad)" filter="url(#shadow)" />

  <!-- Top Zipper Flap -->
  <path d="M100 230 C100 200, 120 180, 150 180 H350 C380 180, 400 200, 400 230 V245 H100 Z" fill="#0F172A" />
  <line x1="120" y1="215" x2="380" y2="215" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 4" />
  <!-- Zipper Pull Tag -->
  <rect x="235" y="210" width="30" height="10" rx="4" fill="#0D9488" />
  <circle cx="250" cy="228" r="6" fill="#14B8A6" />

  <!-- Front Storage Pocket -->
  <rect x="130" y="260" width="240" height="125" rx="16" fill="url(#pocketGrad)" />
  <line x1="145" y1="285" x2="355" y2="285" stroke="#64748B" stroke-width="2" stroke-dasharray="5 3" />
  <rect x="238" y="280" width="24" height="8" rx="3" fill="#0D9488" />

  <!-- Reflective Safety Strip for Wheelchair / Mobility Visibility -->
  <rect x="130" y="350" width="240" height="8" rx="4" fill="url(#tealAccent)" />

  <!-- Side Mesh Bottle / Cane Holder Pockets -->
  <path d="M85 270 C80 270, 75 275, 75 285 V365 C75 375, 80 380, 88 380 H100 V270 Z" fill="#334155" opacity="0.85" />
  <path d="M415 270 C420 270, 425 275, 425 285 V365 C425 375, 420 380, 412 380 H400 V270 Z" fill="#334155" opacity="0.85" />

  <!-- Reinforced Base Feet -->
  <rect x="140" y="405" width="40" height="7" rx="3.5" fill="#020617" />
  <rect x="320" y="405" width="40" height="7" rx="3.5" fill="#020617" />

  <!-- Medical Cross Badge on Front Pocket -->
  <circle cx="250" cy="320" r="14" fill="#0D9488" />
  <path d="M250 312 V328 M242 320 H258" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Label Badge -->
  <text x="250" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1.5">MOBILITY EQUIPMENT BAG</text>
</svg>
